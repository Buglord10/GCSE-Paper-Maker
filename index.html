AQA:{ref:'AQA 8461/1H (Jun 2025)',font:'Arial,Helvetica,sans-serif',num:q=>`<span class="cb"><i></i><i></i></span>`,lab:(d,i,q)=>d==0?`0 ${q+1}`:d==1?`0 ${q+1} . ${i+1}`:`(${ro(i)})`,mk:m=>`[${m} mark${m>1?'s':''}]`,mpos:'below',ln:'',pg:'top',dnw:'Do not write outside the box',frame:1,fl:'*{pg}*',fc:'IB/G/Oct26/{code}',fr:'Turn over ►',cont:'Question {q} continues on the next page',opt:'rt',tick:'Tick (✓) <b>one</b> box.',end:'END OF QUESTIONS',info:['The maximum mark for this paper is {tot}.','The marks for questions are shown in brackets.','You are reminded of the need for good English and clear presentation in your answers.'],ins:['Use black ink or black ball-point pen.','Pencil should only be used for drawing.','Fill in the boxes at the top of this page.','Answer <b>all</b> questions in the spaces provided.','If you need extra space for your answer(s), use the lined pages at the end of this book. Write the question number against your answer(s).','Do all rough work in this book. Cross through any work you do not want to be marked.','In all calculations, show clearly how you work out your answer.'],adv:'',ex:'Question|Mark',addl:'Additional page, if required.<br>Write the question numbers in the left-hand margin.'},
EDX:{ref:'Pearson Edexcel 1BS0/01 (May 2024)',font:'"Myriad Pro","Segoe UI",Arial,sans-serif',lab:(d,i,q)=>d==0?`${q+1}`:d==1?`(${al(i)})`:`(${ro(i)})`,mk:m=>`(${m})`,mpos:'below',ln:'dot',pg:'bottom',frame:0,fl:'{pg}',fc:'*{code}{pg}*',fr:'Turn over',opt:'ltr',tick:'Select <b>one</b> answer.',qtot:1,end:'TOTAL FOR PAPER = {tot} MARKS',dnw:'DO NOT WRITE IN THIS AREA',info:['The total mark for this paper is {tot}.','The marks for each question are shown in brackets – use this as a guide as to how much time to spend on each question.'],ins:['Use black ink or ball-point pen.','Fill in the boxes at the top of this page with your name, centre number and candidate number.','Answer all questions in the spaces provided – there may be more space than you need.','Calculators may be used.'],adv:'Read each question carefully before you start to answer it. Try to answer every question. Check your answers if you have time at the end.',addl:'Extra answer space'},
OCR:{ref:'OCR J277/01 (May 2023)',font:'Arial,Helvetica,sans-serif',lab:(d,i,q)=>d==0?`${q+1}`:d==1?`(${al(i)})`:`(${ro(i)})`,mk:m=>`[${m}]`,mpos:'inline',ln:'dot',pg:'top',frame:0,fl:'© OCR 2026',fc:'',fr:'Turn over',opt:'ltl',tick:'Tick (✓) <b>one</b> box.',end:'END OF QUESTION PAPER',info:['The total mark for this paper is <b>{tot}</b>.','The marks for each question are shown in brackets [ ].','Quality of extended response will be assessed in questions marked with an asterisk (*).','This document has <b>{pages}</b> pages.'],ins:['Use black ink. You can use an HB pencil, but only for graphs and diagrams.','Write your answer to each question in the space provided. If you need extra space use the lined pages at the end of this booklet. The question numbers must be clearly shown.','Answer <b>all</b> the questions.'],adv:'Read each question carefully before you start your answer.',addl:'ADDITIONAL ANSWER SPACE'},
WJEC:{ref:'WJEC C112U10-1 (May 2023)',font:'Arial,Helvetica,sans-serif',lab:(d,i,q)=>d==0?`${q+1}.`:d==1?`(${al(i)})`:`(${ro(i)})`,mk:m=>`[${m}]`,mpos:'inline',ln:'dot',pg:'bottom',frame:0,fl:'{pg2}',fc:'© WJEC CBAC Ltd. ({code})',fr:'Turn over.',opt:'tbl',tick:'Tick (√) <b>one</b> box.',end:'END OF PAPER',info:['The number of marks is given in brackets [ ] at the end of each question or part-question.'],ins:['Use black ink or black ball-point pen. Do not use gel pen or correction fluid.','You may use a pencil for graphs and diagrams only.','Write your name, centre number and candidate number in the spaces at the top of this page.','Answer all questions.','Write your answers in the spaces provided in this booklet.','If further space is required for any question, you should use the additional page(s) at the end of this booklet. The question number(s) should be clearly shown.'],adv:'',ex:'Question|Maximum Mark|Mark Awarded',addl:'Additional page, if required.'},
CCEA:{ref:'CCEA GBL33 Unit 3 Booklet A (2026)',font:'Arial,Helvetica,sans-serif',lab:(d,i,q)=>d==0?'':d==1?`(${al(i)})`:`(${ro(i)})`,head:q=>`Question ${q+1}`,mk:m=>`[${m}]`,mpos:'inline',ln:'und',pg:'none',frame:2,fl:'{ref}',fc:'*{code}{pg2}*',fr:'[Turn over',opt:'ltl',tick:'Tick (✓) <b>one</b> box.',end:'THIS IS THE END OF THE QUESTION PAPER',info:['The total mark for this paper is <b>{tot}</b>.','Figures in brackets printed down the right-hand side of pages indicate the marks awarded to each question or part question.','You may use a ruler and calculator if required.'],ins:['Write your Centre Number and Candidate Number in the spaces provided at the top of this page.','<b>You must answer the questions in the spaces provided.</b>','<b>Do not write outside the boxed area on each page or on blank pages.</b>','Complete questions in black ink and use a dark HB pencil for drawings and graphs.','Answer <b>all</b> questions.'],adv:'',addl:'ADDITIONAL PAGE'}};

let S,uid=()=>Math.random().toString(36).slice(2,9);
const mkQ=(t='short',m=1)=>({id:uid(),type:t,text:'',marks:m,lines:0,opts:'',tbl:'',unit:'',subs:[],figs:[],sec:false,secT:'',secI:'',secB:false,msA:'',msG:'',key:'',lv:'',spec:'',ao1:0,ao2:0,ao3:0,star:false});
const mkP=()=>({id:uid(),title:'Practice paper',subject:'Subject',board:'AQA',tier:'',paper:'Paper 1',dur:'1 hour 30 minutes',total:0,code:'TC01/1',date:'',mat:'a ruler\na scientific calculator',matl:'',sect:'SECTION A',pcode:'P75525A',ins:'',info:'',adv:'',figl:'Figure',insl:'Source',insT:'Source Booklet',addl:2,notes:'',qs:[Object.assign(mkQ('mcq',1),{text:'Which of these is a prime number?',opts:'9\n11\n15\n21'}),Object.assign(mkQ('none',0),{text:'This question is about data.',subs:[Object.assign(mkQ('calc',3),{text:'Calculate **12 × 7**.',unit:'units'}),Object.assign(mkQ('table',2),{text:'Complete the table.',tbl:'x|y\n1|\n2|'})]})]});
const migrate=p=>{if(p.mat==null)p.mat=p.calc||'a scientific calculator';['matl','ins','info','adv'].forEach(k=>{if(p[k]==null)p[k]=''});p.sect=p.sect||'SECTION A';p.pcode=p.pcode||'P75525A';p.figl=p.figl||'Figure';p.insl=p.insl||'Source';p.insT=p.insT||'Source Booklet';(function w(l){l.forEach(q=>{q.figs=q.figs||[];q.msA=q.msA||'';q.msG=q.msG||'';q.key=q.key||'';q.lv=q.lv||'';q.spec=q.spec||'';['ao1','ao2','ao3'].forEach(k=>q[k]=+q[k]||0);w(q.subs||[])})})(p.qs)};
function load(){try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}if(!S||!S.ps?.length){S={cur:null,ps:[mkP()]};}S.ps.forEach(migrate);if(!S.ps.find(p=>p.id==S.cur))S.cur=S.ps[0].id}
let tm,saveErr=0;function save(){$('#st').textContent='Saving…';clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S));$('#st').textContent='Saved '+new Date().toLocaleTimeString()}catch(e){$('#st').textContent='Not saved – storage unavailable. Use Save JSON.'}},350)}
const P=()=>S.ps.find(p=>p.id==S.cur),node=(path,p=P())=>{let l=p.qs,n;for(const i of path.split('.').map(Number)){n=l[i];l=n.subs}return n},lst=(path,p=P())=>{const a=path.split('.').map(Number);let l=p.qs;for(let k=0;k<a.length-1;k++)l=l[a[k]].subs;return[l,a[a.length-1]]};
const leaf=q=>!q.subs.length,sum=q=>leaf(q)?+q.marks||0:q.subs.reduce((a,s)=>a+sum(s),0),tot=p=>p.qs.reduce((a,q)=>a+sum(q),0);
function warns(p){const w=[],t=tot(p);if(p.total&&+p.total!==t)w.push(`Declared total ${p.total} ≠ calculated ${t}.`);
(function f(l,pre){l.forEach((q,i)=>{const n=pre+(pre?'.':'')+(i+1),empty=!q.text.trim()&&leaf(q);if(empty)w.push(`Q${n}: empty question.`);if(leaf(q)&&!(+q.marks>0)&&q.type!='none')w.push(`Q${n}: no marks.`);{const as=(+q.ao1||0)+(+q.ao2||0)+(+q.ao3||0);if(leaf(q)&&as&&as!=+q.marks)w.push(`Q${n}: AO marks (${as}) ≠ question marks (${q.marks}).`)}if(!leaf(q)&&+q.marks>0)w.push(`Q${n}: parent marks ignored (counted from sub-parts).`);if((q.type=='mcq'||q.type=='multi')&&q.opts.split('\n').filter(x=>x.trim()).length<2)w.push(`Q${n}: needs 2+ options.`);const FM=q.text.match(/\{fig\d*\}/g)||[];FM.forEach(m=>{const d=+(m.match(/\d+/)||[1])[0];if(d>(q.figs||[]).length)w.push(`Q${n}: ${m} used but ${(q.figs||[]).length} figure(s) attached.`)});if(!FM.length&&/\b(figure|source|extract)\s+(\d+|[A-Z])\b/i.test(q.text)&&nfig(p)==0)w.push(`Q${n}: mentions a figure/source but none is attached.`);f(q.subs,n)})})(p.qs,'');if(view=='ms'){let m=0,c=0;(function z(l){l.forEach(q=>{if(q.subs.length)z(q.subs);else{c++;if(!(q.msA||'').trim()&&!(q.key||'').trim())m++}})})(p.qs);if(m)w.push(`Mark scheme: ${m} of ${c} questions have no answer yet.`)}return w}
/* ---- editor ---- */
function qHTML(q,path,d){const L=q.subs.length?'':`<input type=number min=0 data-f=marks value="${q.marks}" aria-label=Marks title=Marks>`;
return`<div class=q data-p="${path}"><div class=r><b>${d?(d==1?'('+al(+path.split('.').pop())+')':'('+ro(+path.split('.').pop())+')'):'Q'+(+path+1)}</b><select data-f=type>${Object.entries(TYPES).map(([k,v])=>`<option value=${k} ${q.type==k?'selected':''}>${v}</option>`).join('')}</select>${L}<span class=r style="margin-left:auto"><button data-a=up title="Move up">↑</button><button data-a=dn title="Move down">↓</button><button data-a=dup title=Duplicate>⧉</button>${d<2?'<button data-a=sub>+ Sub-part</button>':''}<button data-a=del title=Delete>✕</button></span></div>${d==0?secUI(q,path):''}
<textarea data-f=text placeholder="Question text. **bold**, _italic_, x^2, H~2O, [[blank]], {a|b} fraction, sqrt(x), {fig} = figure label">${esc(q.text)}</textarea>${extra(q)}${figUI(q)}${msUI(q)}${q.subs.map((s,i)=>qHTML(s,path+'.'+i,d+1)).join('')}</div>`}
