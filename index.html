const GEN={"AQA": ["Mark schemes are prepared by the Lead Assessment Writer and considered, together with the relevant questions, by a panel of subject teachers. This mark scheme includes any amendments made at the standardisation events which all associates participate in and is the scheme which was used by them in this examination. The standardisation process ensures that the mark scheme covers the students\u2019 responses to questions and that every associate understands and applies it in the same correct way. As preparation for standardisation each associate analyses a number of students\u2019 scripts. Alternative answers not already covered by the mark scheme are discussed and legislated for. If, after the standardisation process, associates encounter unusual answers which have not been raised they are required to refer these to the Lead Examiner. It must be stressed that a mark scheme is a working document, in many cases further developed and expanded on the basis of students\u2019 reactions to a particular paper. Assumptions about future mark schemes on the basis of one year\u2019s document should be avoided; whilst the guiding principles of assessment remain constant, details will change, depending on the content of a particular examination paper. No student should be disadvantaged on the basis of their gender identity and/or how they refer to the gender identity of others in their exam responses. A consistent use of \u2018they/them\u2019 as a singular and pronouns beyond \u2018she/her\u2019 or \u2018he/him\u2019 will be credited in exam responses in line with existing mark scheme criteria. Further copies of this mark scheme are available from aqa.org.uk", "Copyright information AQA retains the copyright on all its publications. However, registered schools/colleges for AQA are permitted to copy material from this booklet for their own internal use, with the following important exception: AQA cannot give permission to schools/colleges to photocopy any material that is acknowledged to a third party even for internal use within the centre. Copyright \u00a9 2025 AQA and its licensors. All rights reserved.", "Information to Examiners", "1. General The mark scheme for each question shows:", "\u2022 the marks available for each part of the question", "\u2022 the total marks available for the question", "\u2022 the typical answer or answers which are expected", "\u2022 extra information to help the examiner make their judgement", "\u2022 the Assessment Objectives and specification content that each question is intended to cover. The extra information is aligned to the appropriate answer in the left-hand part of the mark scheme and should only be applied to that item in the mark scheme. At the beginning of a part of a question a reminder may be given, for example: where consequential marking needs to be considered in a calculation; or the answer may be on the diagram or at a different place on the script. In general the right-hand side of the mark scheme is there to provide those extra details which confuse the main part of the mark scheme yet may be helpful in ensuring that marking is straightforward and consistent (for example, a scientifically correct answer that could not reasonably be expected from a student\u2019s knowledge of the specification).", "2. Emboldening and underlining 2.1", "In a list of acceptable answers where more than one mark is available \u2018any two from\u2019 is used, with the number of marks emboldened. Each of the following bullet points is a potential mark.", "2.2", "A bold and is used to indicate that both parts of the answer are required to award the mark.", "2.3", "Alternative answers acceptable for a mark are indicated by the use of or. Alternative words in the mark scheme are shown by a solidus eg allow smooth / free movement.", "2.4", "Any wording that is underlined is essential for the marking point to be awarded.", "3. Marking points 3.1", "Marking of lists This applies to questions requiring a set number of responses, but for which students have provided extra responses. The general principle to be followed in such a situation is that \u2018right + wrong = wrong\u2019. Each error / contradiction negates each correct response. So, if the number of errors / contradictions equals or exceeds the number of marks available for the question, no marks can be awarded. However, responses considered to be neutral (indicated as * in example 1) are not penalised. Example 1: What is the pH of an acidic solution? Student", "Response", "green, 5 red*, 5 red*, 8", "[1 mark] Marks awarded", "Example 2: Name two magnetic materials. Student", "3.2", "Response iron, steel, tin cobalt, nickel, nail*", "[2 marks] Marks awarded", "Use of symbols / formulae If a student writes a chemical symbol / formula instead of a required chemical name, or uses symbols to denote quantities in a physics equation, full credit can be given if the symbol / formula is correct and if, in the context of the question, such action is appropriate.", "3.3", "Marking procedure for calculations Marks should be awarded for each stage of the calculation completed correctly, as students are instructed to show their working. At any point in a calculation students may omit steps from their working. If a subsequent step is given correctly, the relevant marks may be awarded. Full marks should be awarded for a correct numerical answer, without any working shown. Full marks are not awarded for a correct final answer from incorrect working.", "3.4", "Interpretation of \u2018it\u2019 Answers using the word \u2018it\u2019 should be given credit only if it is clear that the \u2018it\u2019 refers to the correct subject.", "3.5", "Errors carried forward An error can be carried forward from one question part to the next and is shown by the abbreviation \u2018ecf\u2019. Within an individual question part, an incorrect value in one step of a calculation does not prevent all of the subsequent marks being awarded.", "3.6", "Phonetic spelling Marks should be awarded if spelling is not correct but the intention is clear, unless there is a possible confusion with another technical term.", "3.7", "Brackets (\u2026...) are used to indicate information which is not essential for the mark to be awarded but is included to help the examiner identify the sense of the answer required.", "3.8", "Allow In the mark scheme additional information, \u2018allow\u2019 is used to indicate creditworthy alternative answers.", "3.9", "Ignore Ignore is used when the information given is irrelevant to the question or not enough to gain the marking point. Any further correct amplification could gain the marking point.", "3.10 Do not accept Do not accept means that this is a wrong answer which, even if the correct answer is given as well, will still mean that the mark is not awarded. 3.11 Numbered answer lines Numbered lines on the question paper are intended to support the student to give the correct number of responses. The answer should still be marked as a whole.", "4. Level of response marking instructions Extended response questions are marked on level of response mark schemes.", "\u2022 Level of response mark schemes are broken down into levels, each of which has a descriptor.", "\u2022 The descriptor for the level shows the average performance for the level.", "\u2022 There are two marks in each level. Before you apply the mark scheme to a student\u2019s answer, read through the answer and, if necessary, annotate it (as instructed) to show the qualities that are being looked for. You can then apply the mark scheme.", "Step 1: Determine a level Start at the lowest level of the mark scheme and use it as a ladder to see whether the answer meets the descriptor for that level. The descriptor for the level indicates the different qualities that might be seen in the student\u2019s answer for that level. If it meets the lowest level then go to the next one and decide if it meets this level, and so on, until you have a match between the level descriptor and the answer. With practice and familiarity you will find that for better answers you will be able to quickly skip through the lower levels of the mark scheme. When assigning a level you should look at the overall quality of the answer. Do not look to penalise small and specific parts of the answer where the student has not performed quite as well as the rest. If the answer covers different aspects of different levels of the mark scheme you should use a best fit approach for defining the level. Use the variability of the response to help decide the mark within the level, ie if the response is predominantly level 2 with a small amount of level 3 material it would be placed in level 2 but be awarded a mark near the top of the level because of the level 3 content. Step 2: Determine a mark Once you have assigned a level you need to decide on the mark. The descriptors on how to allocate marks can help with this. The exemplar materials used during standardisation will help. There will be an answer in the standardising materials which will correspond with each level of the mark scheme. This answer will have been awarded a mark by the Lead Examiner. You can compare the student\u2019s answer with the example to determine if it is the same standard, better or worse than the example. You can then use this to allocate a mark for the answer based on the Lead Examiner\u2019s mark on the example. You may well need to read back through the answer as you apply the mark scheme to clarify points and assure yourself that the level and the mark are appropriate. Indicative content in the mark scheme is provided as a guide for examiners. It is not intended to be exhaustive and you must credit other valid points. Students do not have to cover all of the points mentioned in the indicative content to reach the highest level of the mark scheme. You should ignore any irrelevant points made. However, full marks can be awarded only if there are no incorrect statements that contradict a correct response. An answer which contains nothing of relevance to the question must be awarded no marks."], "EDX": ["General Marking Guidance", "All candidates must receive the same treatment. Examiners must mark the first candidate in exactly the same way as they mark the last.", "Mark schemes should be applied positively. Candidates must be rewarded for what they have shown they can do rather than penalised for omissions.", "Examiners should mark according to the mark scheme not according to their perception of where the grade boundaries may lie.", "There is no ceiling on achievement. All marks on the mark scheme should be used appropriately.", "All the marks on the mark scheme are designed to be awarded. Examiners should always award full marks if deserved, i.e. if the answer matches the mark scheme. Examiners should also be prepared to award zero marks if the candidate\u2019s response is not worthy of credit according to the mark scheme.", "Where some judgement is required, mark schemes will provide the principles by which marks will be awarded and exemplification may be limited.", "When examiners are in doubt regarding the application of the mark scheme to a candidate\u2019s response, the team leader must be consulted.", "Crossed out work should be marked UNLESS the candidate has replaced it with an alternative response.", "Mark schemes will indicate within the table where, and which strands of QWC, are being assessed. The strands are as follows:", "i) ensure that text is legible and that spelling, punctuation and grammar are accurate so that meaning is clear ii) elect and use a form and style of writing appropriate to purpose and to complex subject matter iii) organise information clearly and coherently, using specialist vocabulary when appropriate."], "OCR": ["MARKING INSTRUCTIONS PREPARATION FOR MARKING RM ASSESSOR 1.", "Make sure that you have accessed and completed the relevant training packages for on -screen marking: RM Assessor Assessor Online Training; OCR Essential Guide to Marking.", "2.", "Make sure that you have read and understood the mark scheme and the question paper for this unit. These are posted on the RM Cambridge Assessment Support Portal http://www.rm.com/support/ca", "3.", "Log-in to RM Assessor and mark the required number of practice responses (\u201cscripts\u201d) and the number of required standardisation responses. YOU MUST MARK 10 STANDARDISATION RESPONSES BEFORE YOU CAN BE APPROVED TO MARK LIVE SCRIPTS.", "MARKING 1.", "Mark strictly to the mark scheme.", "2.", "Marks awarded must relate directly to the marking criteria.", "3.", "The schedule of dates is very important. It is essential that you meet the RM Assessor 50% and 100% (traditional 40% Batch 1 and 100% Batch 2) deadlines. If you experience problems, you must contact your Team Leader (Supervisor) without delay.", "4.", "If you are in any doubt about applying the mark scheme, consult your Team Leader by telephone or the RM Assessor messaging sy stem, or by email.", "5.", "Crossed Out Responses Where a candidate has crossed out a response and provided a clear alternative then the crossed out response is not marked. Wh ere no alternative response has been provided, examiners may give candidates the benefit of the doubt and mark the crossed out resp onse where legible. Rubric Error Responses \u2013 Optional Questions Where candidates have a choice of question across a whole paper or a whole section and have provided more answers than requir ed, then all responses are marked and the highest mark allowable within the rubric is given. Enter a mark for each question answere d into RM assessor, which will select the", "highest mark from those awarded. (The underlying assumption is that the candidate has penalised themselves by attempting more questions than necessary in the time allowed.) Multiple Choice Question Responses When a multiple choice question has only a single, correct response and a candidate provides two responses (even if one of th ese responses is correct), then no mark should be awarded (as it is not possible to determine which was the first response selected by the candidate). When a question requires candidates to select more than one option/multiple options, then local marking arrangements need to ensure consistency of approach. Contradictory Responses When a candidate provides contradictory responses, then no mark should be awarded, even if one of the answers is correct. Short Answer Questions (requiring only a list by way of a response, usually worth only one mark per response) Where candidates are required to provide a set number of short answer responses then only the set number of responses should be marked. The response space should be marked from left to right on each line and then line by line until the required number of r esponses have been considered. The remaining responses should not then be marked. Examiners will have to apply judgement as to whether a \u2018second response\u2019 on a line is a development of the \u2018first response\u2019, rather than a separate, discrete response. (The underlying assumption is that the candidate is attempting to hedge their bets and therefore getting undue benefit rather than engaging with the question and giving the most relevant/correct responses.) Short Answer Questions (requiring a more developed response, worth two or more marks) If the candidates are required to provide a description of, say, three items or factors and four items or factors are provide d, then mark on a similar basis \u2013 that is downwards (as it is unlikely in this situation that a candidate will provide more than on e response in each section of the response space.) Longer Answer Questions (requiring a developed response) Where candidates have provided two (or more) responses to a medium or high tariff question which only required a single (deve loped) response and not crossed out the first response, then only the first response should be marked. Examiners will need to apply professional judgement as to whether the second (or a subsequent) response is a \u2018new start\u2019 or simply a poorly expressed continuation of the first response. 6.", "Always check the pages (and additional objects if present) at the end of the response in case any answers have been continued there. If the candidate has continued an answer there, then add a tick to confirm that the work has been seen.", "7.", "Award No Response (NR) if:", "\u2022 there is nothing written in the answer space", "there is nothing of relevance to the question written in the answer space", "Award Zero \u20180\u2019 if:", "\u2022 anything is written in the answer space and is related to the question and is not worthy of credit (this includes text and symbols). Team Leaders must confirm the correct use of the NR button with their markers before live marking commences and should check this when reviewing scripts. 8.", "The RM Assessor comments box is used by your team leader to explain the marking of the practice responses. Please refer to these comments when checking your practice responses. Do not use the comments box for any other reason. If you have any questions or comments for your team leader, use the phone, the RM Assessor messaging system, or e -mail.", "9.", "Assistant Examiners will send a brief report on the performance of candidates to their Team Leader (Supervisor) via email by the end of the marking period. The report should contain notes on particular strengths displayed as well as common errors or weaknes ses. Constructive criticism of the question paper/mark scheme is also appreciated .", "10.", "For answers marked by levels of response: Not applicable in F501 a. To determine the level \u2013 start at the highest level and work down until you reach the level that matches the answer b. To determine the mark within the level, consider the following Descriptor", "Award mark", "On the borderline of this level and the one below At bottom of level Just enough achievement on balance for this level Meets the criteria but with some slight inconsistency", "Above bottom and either below middle or at middle of level (depending on number of marks available) Above middle and either below top of level or at middle of level (depending on number of marks available)", "Consistently meets the criteria for this level", "At top of level", "11.", "Annotations Annotation", "Meaning Omission mark Benef it of doubt (must be accompanied with a tick) Cross Follow through (must be accompanied with a tick) Not answered question Benef it of doubt not given Repeat Tick Too vague Blank pages, pages with no annotation, no attempt to answer the question, page seen on QER QER Level 1 mark awarded QER Level 2 mark awarded QER Level 3 mark awarded"], "WJEC": ["About this marking scheme The purpose of this marking scheme is to provide teachers, learners, and other interested parties, with an understanding of the assessment criteria used to assess this specific assessment. This marking scheme reflects the criteria by which this assessment was marked in a live series and was finalised following detailed discussion at an examiners' conference. A team of qualified examiners were trained specifically in the application of this marking scheme. The aim of the conference was to ensure that the marking scheme was interpreted and applied in the same way by all examiners. It may not be possible, or appropriate, to capture every variation that a candidate may present in their responses within this marking scheme. However, during the training conference, examiners were guided in using their professional judgement to credit alternative valid responses as instructed by the document, and through reviewing exemplar responses. Without the benefit of participation in the examiners' conference, teachers, learners and other users, may have different views on certain matters of detail or interpretation. Therefore, it is strongly recommended that this marking scheme is used alongside other guidance, such as published exemplar materials or Guidance for Teaching. This marking scheme is final and will not be changed, unless in the event that a clear error is identified, as it reflects the criteria used to assess candidate responses during the live series.", "Instructions for examiners of GCSE Geography when applying the marking scheme", "1.", "Positive marking It should be remembered that learners are writing under examination conditions and credit should be given for what the learner writes, rather than adopting the approach of penalising him/her for any omissions. It should be possible for a very good response to achieve full marks and a very poor one to achieve zero marks. Marks should not be deducted for a less than perfect answer if it satisfies the criteria of the mark scheme. GCSE Geography marking schemes are presented in a common format as shown below:", "Credit two simple statements based on map evidence. Credit accurate use of compass points max 1 Credit accurate use of scale line max 1 This box contains the rationale i.e. it explains the principles that must be applied when marking each subquestion. The examiner must apply this rationale when applying the marking scheme to the response.", "2.", "AO4", "Total", "AO3", "AO2.2", "AO1", "3 (a) (i) Describe the location of the island of Lefkada.", "AO2.1", "The columns to the right indicate the assessment objective(s) targeted by the question and its mark tariff.", "This box contains the sub-question", "In western Greece (1) In Ionian Sea (1) north of Cephalonia (1) 275km (+/-10) from Athens (1) 280km (+/-10) from Thessaloniki", "(1)", "This box contains the candidates' expected responses for point-based marking. For some sub-questions, those with a closed question, this box will indicate the only response that is acceptable. For more open ended sub-questions this box will illustrate a number of likely responses that are credit worthy. It may be that this list will be extended at the examiner's conference after actual scripts have been read. For banded mark schemes this box contains indicative content. For further details see below under Banded mark schemes Stage 2.", "Tick marking Low tariff questions should be marked using a points-based system. Each credit worthy response should be ticked in red pen. The number of ticks must equal the mark awarded for the sub-question. The mark scheme should be applied precisely using the expected outcomes box as a guide to the responses that are acceptable. Do not use crosses to indicate answers that are incorrect. If the candidate has not attempted the question, then the examiner should enter a dash (-) or use the not attempted icon on E-marker.", "3.", "Banded mark schemes Banded mark schemes are divided so that each band has a relevant descriptor. The descriptor for the band provides a description of the performance level for that band. Each band contains marks. Examiners should first read and annotate a learner\u2019s answer to pick out the evidence that is being assessed in that question. Do not use ticks on the candidate\u2019s response. Once the annotation is complete, the mark scheme can be applied. This is done as a two-stage process. Stage 1 \u2013 Deciding on the band When deciding on a band, the answer should be viewed holistically. Beginning at the lowest band, examiners should look at the learner\u2019s answer and check whether it matches the descriptor for that band. Examiners should look at the descriptor for that band and see if it matches the qualities shown in the learner\u2019s answer. If the descriptor at the lowest band is satisfied, examiners should move up to the next band and repeat this process for each band until the descriptor matches the answer. If an answer covers different aspects of different bands within the mark scheme, a \u2018best fit\u2019 approach should be adopted to decide on the band and then the learner\u2019s response should be used to decide on the mark within the band. For instance, if a response is mainly in band 2 but with a limited amount of band 3 content, the answer would be placed in band 2, but the mark awarded would be close to the top of band 2 as a result of the band 3 content. Examiners should not seek to mark candidates down as a result of small omissions in minor areas of an answer. Stage 2 \u2013 Deciding on the mark Once the band has been decided, examiners can then assign a mark. During standardising (marking conference), detailed advice from the Principal Examiner on the qualities of each mark band will be given. Examiners will then receive examples of answers in each mark band that have been awarded a mark by the Principal Examiner. Examiners should mark the examples and compare their marks with those of the Principal Examiner. When marking, examiners can use these examples to decide whether a learner\u2019s response is of a superior, inferior or comparable standard to the example. Examiners are reminded of the need to revisit the answer as they apply the mark scheme in order to confirm that the band and the mark allocated is appropriate to the response provided. Indicative content is also provided for banded mark schemes. Indicative content is not exhaustive, and any other valid points must be credited. In order to reach the highest bands of the mark scheme a learner need not cover all of the points mentioned in the indicative content but must meet the requirements of the highest mark band. Where a response is not creditworthy, that is contains nothing of any significance to the mark scheme, or where no response has been provided, no marks should be awarded.", "Do not allow opposites.", "SPaG", "AO4", "Total", "natural increase in population / where birth rate exceeds death rate (1) increased access to health care (1) means people live longer (1) rural to urban migration (1) because of poor standards of housing / health care / education (1) rural to urban migration (1) more job opportunities in cities (1) higher paid jobs (1) location & Investment from MNC\u2019s (1) so higher paid jobs / increase in jobs results (1) less access to contraception (1) so larger families result (1) Do not allow \u2018population increase\u2019 on its own.", "AO3", "AO2.2", "AO1", "(a) (iii) Explain two reasons why cities in LICs and/or NICs are growing so rapidly.", "Credit two reasons with up to two additional marks for elaboration. (1+1) (1+1) or (1+1+1) +1", "Working 24 \u2013 15 = 9 9 x 100 (1) = 60", "Answer: % increase = 60 (1)", "AO2.1", "Credit working for one mark. One mark for correct response.", "Total", "SPaG", "AO4", "AO3", "AO2.2", "(a) (ii) One of the fastest growing cities is estimated to be Lagos in Nigeria. Calculate the % population increase for Lagos between 2022 and 2035. Show your working in the box below.", "AO2.1", "Examples of responses - None in North America (1) or South America (1) - More in Africa (1) - More south of the Equator (1) - Fewer in Asia (1) - More concentrated / Less spread out (1) - Most / all in Africa and Asia (1)", "AO1", "Credit four simple statements. Answers must refer to change and location, not size or number.", "Total", "SPaG", "AO4", "AO3", "AO2.2", "AO2.1", "1 (a) (i) Study Figure 1.1 Expected location of the world\u2019s largest cities between 2050 and 2100 Describe the pattern of expected changes in the location of the world\u2019s largest cities shown in Figure 1.1", "AO1", "Theme 1, Question 1", "Use a banded mark scheme. Work upwards from the lowest band. Band Mark Band descriptor", "3-4", "1-2", "Clear description through some elaborated statements. Must be some specific reference to the chosen city Simple valid statement (s) that may be generic in nature. Lacks elaboration. Award zero marks if answer is incorrect or wholly irrelevant.", "Responses must refer to a LIC/NIC city. If no name Max Band 1", "Total", "SPaG", "AO4", "AO3", "AO2.2", "AO2.1", "AO1", "(b) Describe how a city in a LIC/NIC you have studied is tackling housing problems.", "Responses will depend on chosen city. To reach Band 2 it should be clear that they are referring to a specific area and not just making generic points. Responses are likely to refer to poor quality housing clearance schemes or self-help projects."], "CCEA": ["General Marking Instructions Introduction Mark schemes are intended to ensure that the GCSE examinations are marked consistently and fairly. The mark schemes provide markers with an indication of the nature and range of candidates\u2019 responses likely to be worthy of credit. They also set out the criteria which they should apply in allocating marks to candidates\u2019 responses. Assessment objectives Below are the assessment objectives for GCSE Biology. Candidates must: AO1 AO2 AO3", "demonstrate knowledge and understanding of: scientific ideas; and scientific techniques and procedures; apply knowledge and understanding of and develop skills in: scientific ideas; scientific enquiry, techniques and procedures; and analyse scientific information and ideas to: interpret and evaluate; make judgements and draw conclusions and develop and improve experimental procedures.", "Quality of candidates\u2019 responses In marking the examination papers, examiners should be looking for a quality of response reflecting the level of maturity which may reasonably be expected of a 16-year-old which is the age at which the majority of candidates sit their GCSE examinations. Flexibility in marking Mark schemes are not intended to be totally prescriptive. No mark scheme can cover all the responses which candidates may produce. In the event of unanticipated answers, examiners are expected to use their professional judgement to assess the validity of answers. If an answer is particularly problematic, then examiners should seek the guidance of the Supervising Examiner. Positive marking Examiners are encouraged to be positive in their marking, giving appropriate credit for what candidates know, understand and can do rather than penalising candidates for errors or omissions. Examiners should make use of the whole of the available mark range for any particular question and be prepared to award full marks for a response which is as good as might reasonably be expected of a 16-year-old GCSE candidate. Awarding zero marks Marks should only be awarded for valid responses and no marks should be awarded for an answer which is completely incorrect or inappropriate. Marking calculations In marking answers involving calculations, examiners should apply the \u2018own figure rule\u2019 so that candidates are not penalised more than once for a computational error. Types of mark schemes Mark schemes for tasks or questions which require candidates to respond in extended written form are marked on the basis of levels of response which take account of the quality of written communication.", "Other questions which require only short answers are marked on a point for point basis with marks awarded for each valid piece of information provided. Levels of response Tasks and questions requiring candidates to respond in extended writing are marked in terms of levels of response. In deciding which level of response to award, examiners should look for the \u2018best fit\u2019 bearing in mind that weakness in one area may be compensated for by strength in another. In deciding which mark within a particular level to award to any response, examiners are expected to use their professional judgement. The following guidance is provided to assist examiners. Threshold performance: Response which just merits inclusion in the level and should be awarded a mark at or near the bottom of the range. Intermediate performance: Response which clearly merits inclusion in the level and should be awarded a mark at or near the middle of the range. High performance: Response which fully satisfies the level description and should be awarded a mark at or near the top of the range. Quality of written communication Quality of written communication is taken into account in assessing candidates\u2019 responses to all tasks and questions that require them to respond in extended written form. These tasks and questions are marked on the basis of levels of response. The description for each level of response includes reference to the quality of written communication. For conciseness, quality of written communication is distinguished within bands of response as follows: Band A: Quality of written communication is excellent. Band B: Quality of written communication is good. Band C: Quality of written communication is basic. In interpreting these level descriptions, examiners should refer to the more detailed guidance provided below: Band A (Excellent): The candidate successfully selects and uses the most appropriate form and style of writing. Relevant material is organised with a high degree of clarity and coherence. There is widespread and accurate use of appropriate specialist vocabulary. Presentation, spelling, punctuation and grammar are of a su\ufb03ciently high standard to make meaning clear. Band B (Good): The candidate makes a reasonable selection and use of an appropriate form and style of writing. Relevant material is organised with some clarity and coherence. There is some use of appropriate specialist vocabulary. Presentation, spelling, punctuation and grammar are su\ufb03ciently competent to make meaning clear. Band C (Basic): The candidate makes only a limited selection and use of an appropriate form and style of writing. The organisation of material may lack clarity and coherence. There is little use of specialist vocabulary. Presentation, spelling, punctuation and grammar may be such that intended meaning is not clear."]};
